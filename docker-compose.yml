services:
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev"
    volumes: [".:/workspace"]
    ports: ["5173:5173"]
  api:
    image: python:3.13-slim
    working_dir: /workspace
    command: sh -c "apt-get update && apt-get install -y tshark && pip install -r apps/api/requirements.txt && uvicorn apps.api.packetpilot.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: [".:/workspace"]
    ports: ["8000:8000"]
